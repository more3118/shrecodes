# Sample workflow for building and deploying a Next.js site to GitHub Pages
#
# To get started with Next.js see: https://nextjs.org/docs/getting-started
#
name: Deploy Next.js site to Pages

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run dependency audit
        run: |
          set -euo pipefail
          max_attempts=3
          attempt=1

          while [ "$attempt" -le "$max_attempts" ]; do
            echo "Running npm audit (attempt $attempt/$max_attempts)..."

            set +e
            audit_report="$(mktemp)"
            npm audit --audit-level=high --json >"$audit_report" 2>&1
            audit_status=$?
            set -e

            cat "$audit_report"

            if [ "$audit_status" -eq 0 ]; then
              rm -f "$audit_report"
              exit 0
            fi

            audit_error_code="$(node -e 'const fs=require("node:fs");try{const output=fs.readFileSync(process.argv[1],"utf8");const start=output.indexOf(\"{\");const end=output.lastIndexOf(\"}\");if(start===-1||end===-1||end<start){process.exit(0);}const report=JSON.parse(output.slice(start,end+1));if(report?.error?.code!==undefined){process.stdout.write(String(report.error.code));}}catch{}' "$audit_report")"
            rm -f "$audit_report"

            if [ "$audit_error_code" = "503" ]; then
              if [ "$attempt" -lt "$max_attempts" ]; then
                sleep $((attempt * 5))
                attempt=$((attempt + 1))
                continue
              fi

              echo "::warning title=Dependency audit skipped::npm advisory service returned HTTP 503 after $max_attempts attempts; continuing without a completed vulnerability audit."
              {
                echo "### Dependency audit skipped"
                echo
                echo "- Reason: npm advisory service returned HTTP 503 after $max_attempts attempts."
                echo "- Impact: build continued without a completed vulnerability audit."
              } >>"$GITHUB_STEP_SUMMARY"
              exit 0
            fi

            exit "$audit_status"
          done

      - name: Run lint
        run: npm run lint

      - name: Build with Next.js
        run: npm run build

      - name: Setup Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v6
        with:
          static_site_generator: next

      - name: Upload artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
